name: Claude Code (builder)

# Builder agent for Mason's builder/reviewer loop.
# Triggered ONLY by @claude in issue/PR comments and PR reviews — NOT on issue
# open/assign. A write-access human must comment @claude to launch the builder
# (trigger governance). Conventions/review contract live in AGENTS.md / loop-constraints.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    # Job-level (not workflow-level): a skipped job does not occupy the group,
    # so no-op runs from ordinary comments cannot evict a pending real @claude run.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # read CI results on PRs
    steps:
      # Mechanical fix-round cap. Runs inside the builder's own (non-GITHUB_TOKEN-
      # triggered) run and counts builder commits BEFORE acting, so it avoids the
      # "GITHUB_TOKEN push does not trigger workflows" pitfall and any race.
      - name: Fix-round cap guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          # PR-ness from the event payload (deterministic), NOT an API probe that
          # cannot tell 404 (not a PR) from rate-limit/permission/transient errors.
          IS_PR: ${{ github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) }}
        run: |
          set -uo pipefail
          if [ "$IS_PR" != "true" ]; then
            echo "Not a PR context; no fix-round cap."
            exit 0
          fi
          # It IS a PR. This step is the safety circuit breaker, so fail CLOSED
          # (stop the builder) if the commit count cannot be fetched.
          if ! builder_commits=$(gh api "repos/$REPO/pulls/$NUM/commits" --paginate \
                --jq '.[] | select((.author.login // "") == "claude[bot]" or (.commit.author.name // "") == "claude[bot]") | .sha' 2>/dev/null); then
            echo "::error::Could not fetch PR commits to enforce the fix-round cap; failing closed."
            exit 1
          fi
          n=$(printf '%s' "$builder_commits" | grep -c . || true)
          echo "builder commits on PR #$NUM: $n (cap: 1 impl + 3 fixes = 4)"
          if [ "$n" -ge 4 ]; then
            gh label create needs-human -R "$REPO" -c B60205 -d "Fix-round cap reached; a human must clear before the builder acts again" 2>/dev/null || true
            gh pr edit "$NUM" -R "$REPO" --add-label needs-human || true
            gh pr comment "$NUM" -R "$REPO" --body "Fix-round cap reached: $n builder commits (1 implementation + 3 fix rounds). The builder stops here. A human must review and remove the \`needs-human\` label before @claude will act on this PR again."
            echo "::error::Fix-round cap reached ($n builder commits). Escalated to human."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Auth via Claude subscription (Pro/Max): generate with `claude setup-token`
          # locally, store as the CLAUDE_CODE_OAUTH_TOKEN repo secret.
          # To use pay-as-you-go API billing instead, swap this line for:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Edit,Write,MultiEdit,Read,Glob,Grep,Bash(npm ci),Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm test),Bash(node --test),Bash(npm run lint:*),Bash(node dist/*)"
            --system-prompt "You are the builder in a builder/reviewer loop. Follow AGENTS.md and loop-constraints.md in this repo. One issue -> one branch -> one focused PR. Run the repo's quality gates before opening or updating a PR. When addressing Codex review comments, push fixes to the same PR branch; never open a new PR and never merge. Stop and ask for a human after 3 fix rounds on one PR."
